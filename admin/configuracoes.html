<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dados da empresa | UP Personaliza</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/admin/assets/catalogo.css"><script src="/admin/assets/configuracoes.js" defer></script></head><body><header class="topbar"><a class="wordmark" href="/admin/catalogo">UP Personaliza <span>Administração local</span></a><nav aria-label="Administração"><a href="/admin/catalogo">Catálogo</a><a href="/admin/solicitacoes">Solicitações</a><a href="/admin/configuracoes" aria-current="page">Dados da empresa</a></nav></header><main><div class="intro"><h1>Dados públicos</h1></div><p id="status" role="status" aria-live="polite"></p><form><div class="fields"><label class="field">Nome empresarial<input name="legalName" maxlength="1000"></label><label class="field">CNPJ<input name="cnpj" maxlength="18"></label><label class="field">Endereço público<input name="address" maxlength="1000"></label><label class="field">Cidade<input name="city" maxlength="1000"></label><label class="field">Estado<input name="state" maxlength="1000"></label><label class="field">WhatsApp com código do país e DDD<input name="whatsapp" type="tel" placeholder="55 + DDD + número" maxlength="30"></label><label class="field">E-mail de atendimento<input name="email" type="email" maxlength="254"></label><label class="field">Horário de atendimento<input name="businessHours" maxlength="1000"></label><label class="field">Regiões atendidas e condições de instalação<textarea name="serviceArea" maxlength="1000" rows="3"></textarea></label><label class="field">Condições reais de produção e prazo<textarea name="productionPolicy" maxlength="1000" rows="3"></textarea></label></div><p>Os dados serão exibidos no atendimento, rodapé e orientações da loja. Campos vazios ficam ocultos. O cadastro não altera credenciais, taxas ou pagamentos.</p><button type="submit" class="primary">Salvar dados públicos</button></form></main></body></html>
